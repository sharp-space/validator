name: CodeQL
on:
  push:
    branches:
    - main
  pull_request:
  schedule:
  - cron: 30 3 * * 1
permissions:
  contents: read
  security-events: write
defaults:
  run:
    shell: bash
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
# The job's timeout-minutes is several times a healthy run, so a stuck analysis fails the check instead of holding the
# runner for GitHub's six-hour default.
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
      with:
        languages: csharp
        build-mode: none
    - name: Analyze source
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
