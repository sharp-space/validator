name: Verify
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        sdk:
        - '10.0.403'
        - '10.0.x'
    runs-on: "${{ matrix.os }}"
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Set up .NET SDK
      id: sdk
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
      with:
        dotnet-version: "${{ matrix.sdk }}"
    - name: Select the installed SDK for this test job
      env:
        TEST_SDK_VERSION: "${{ steps.sdk.outputs.dotnet-version }}"
      run: |-
        python3 - <<'PYTHON'
        import json
        import os
        from pathlib import Path

        path = Path("global.json")
        config = json.loads(path.read_text())
        config["sdk"]["version"] = os.environ["TEST_SDK_VERSION"]
        config["sdk"]["rollForward"] = "disable"
        path.write_text(json.dumps(config, indent=2) + "\n")
        PYTHON
        dotnet --version
    - name: Test coverage policy guards
      run: python3 -m unittest discover -s eng/coverage -p '*_test.py'
    - name: Verify coverage exclusions
      run: python3 eng/coverage/verify-coverage.py --check-policy
    - name: Build
      run: dotnet build Sharp.Validator.slnx -c Release -warnaserror
    - name: Test with coverage
      run: dotnet test --solution Sharp.Validator.slnx -c Release --no-build --coverlet
    - name: Upload coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: coverage-test-${{ matrix.os }}-${{ matrix.sdk }}
        path: test/artifacts/coverage
        if-no-files-found: error
      if: always()
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs:
    - test
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Download coverage
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: coverage-*
        path: test/artifacts/coverage
    - name: Verify coverage
      run: python3 eng/coverage/verify-coverage.py test/artifacts/coverage
  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
      with:
        dotnet-version: '10.0.x'
    - name: Build
      run: dotnet build Sharp.Validator.slnx -c Release -warnaserror
    - name: Pack
      run: dotnet pack Sharp.Validator.slnx -c Release --no-build --include-symbols
        -p:SymbolPackageFormat=snupkg -o artifacts/packages
    - name: Verify package contents
      run: ".github/scripts/verify-packages.sh artifacts/packages"
    - name: Upload packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: packages
        path: |-
          artifacts/packages/*.nupkg
          artifacts/packages/*.snupkg
        if-no-files-found: error
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
      with:
        dotnet-version: '10.0.x'
    - name: Build
      run: dotnet build Sharp.Validator.slnx -c Release -warnaserror
    - name: Verify benchmark scenarios
      run: |
        dotnet run --project test/Sharp.Validator.Benchmarks -c Release --no-build -- --check
        dotnet run --project test/Sharp.Validator.ComparisonBenchmarks -c Release --no-build -- --check
    - name: Verify benchmark scenarios with generated accessors
      run: |
        dotnet build test/Sharp.Validator.Benchmarks/Sharp.Validator.Benchmarks.csproj -c Release -warnaserror -p:SharpBenchmarkAccessors=Generated
        dotnet run --project test/Sharp.Validator.Benchmarks -c Release --no-build -- --check
  aot:
    name: AOT
    runs-on: ubuntu-latest
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
      with:
        dotnet-version: '10.0.x'
    - name: Install AOT prerequisites
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: Publish AOT
      run: |-
        mkdir -p artifacts
        dotnet publish test/Sharp.Validator.AotTests/Sharp.Validator.AotTests.csproj \
          -c Release -r linux-x64 -warnaserror -o artifacts/aot 2>&1 | tee artifacts/aot.log
    - name: Verify AOT warnings
      run: "! grep -E '(warning|error) IL[0-9]{4}' artifacts/aot.log"
    - name: Run AOT
      run: "./artifacts/aot/Sharp.Validator.AotTests"
    - name: Upload AOT log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: aot-log
        path: artifacts/aot.log
        if-no-files-found: error
      if: always()
  verify:
    name: Verify
    if: always()
    needs:
    - test
    - coverage
    - pack
    - benchmark
    - aot
    runs-on: ubuntu-latest
    steps:
    - name: Verify job results
      env:
        NEEDS_JSON: "${{ toJSON(needs) }}"
      run: |-
        python3 - <<'PYTHON'
        import json
        import os
        import sys

        jobs = json.loads(os.environ["NEEDS_JSON"])
        for name, job in sorted(jobs.items()):
            print(f"{name}: {job.get('result', 'missing')}")
        failed = [name for name, job in jobs.items() if job.get("result") != "success"]
        if not jobs or failed:
            print("::error::One or more required verification jobs did not succeed.")
            sys.exit(1)
        PYTHON
on:
  push:
    branches:
    - main
  pull_request:
